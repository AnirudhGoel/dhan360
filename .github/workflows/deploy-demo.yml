# Builds the fully client-side app (VITE_CLIENT=true) and publishes it to GitHub Pages.
# Runs entirely in the browser (data in IndexedDB, no server). First visit shows the sample
# portfolio; visitors can import their own data and it stays on their device.
name: Deploy dhan360 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build client app (fully in-browser; seeds sample data on first visit)
        working-directory: frontend
        env:
          VITE_PARSE_CAS_URL: ${{ secrets.VITE_PARSE_CAS_URL }}
          VITE_EQUITY_PRICES_URL: ${{ secrets.VITE_EQUITY_PRICES_URL }}
        run: npm run build:client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
